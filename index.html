<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainGym — Stroop Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151a;
    --surface:#1b1f27;
    --surface-2:#232833;
    --line:#2c3240;
    --text:#eceef1;
    --text-dim:#8b92a1;
    --accent:#49d3c4;
    --accent-dim:#2a5a55;
    --danger:#e4483c;
    --c-red:#e5493d;
    --c-blue:#3e7cf2;
    --c-green:#33b47a;
    --c-yellow:#f0b90b;
    --c-purple:#9a6bf0;
    --radius:14px;
    --font-display:'Space Grotesk', 'Avenir Next', 'Segoe UI', sans-serif;
    --font-body:'IBM Plex Sans', 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'SF Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes popIn{ from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);} }
  @keyframes dotPulse{ 0%,100%{box-shadow:0 0 0 0 rgba(63,217,130,.55);} 50%{box-shadow:0 0 0 6px rgba(63,217,130,0);} }
  @keyframes ringWarn{ 0%,100%{filter:drop-shadow(0 0 0 rgba(228,72,60,0));} 50%{filter:drop-shadow(0 0 6px rgba(228,72,60,.7));} }
  @keyframes floatGlow{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(-8px,10px);} }
  @keyframes medalBob{ 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-4px) rotate(4deg);} }
  @keyframes confettiDrop{
    0%{ transform:translateY(-10px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(140px) rotate(320deg); opacity:0; }
  }
  @keyframes countPop{ 0%{opacity:0; transform:scale(.4);} 55%{opacity:1; transform:scale(1.12);} 100%{opacity:1; transform:scale(1);} }
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, #1c2733 0%, transparent 45%),
      radial-gradient(circle at 110% 10%, #241a2e 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100%;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:''; position:fixed; top:-120px; right:-100px; width:280px; height:280px; border-radius:50%;
    background:radial-gradient(circle, rgba(73,211,196,.16) 0%, transparent 70%);
    animation:floatGlow 9s ease-in-out infinite; pointer-events:none; z-index:0;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    padding:28px 20px 40px;
    display:flex;
    flex-direction:column;
    position:relative;
    z-index:1;
  }
  .wordmark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:28px;
    letter-spacing:-0.02em;
    display:flex;
    align-items:baseline;
    gap:8px;
    animation:fadeUp .5s ease both;
  }
  .wordmark span:not(.dot){
    background:linear-gradient(100deg, var(--accent) 10%, #7fe9dd 50%, var(--accent) 90%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .wordmark .dot{color:var(--accent); -webkit-text-fill-color:var(--accent);}
  .tagline{color:var(--text-dim); font-size:13.5px; margin-top:2px; animation:fadeUp .5s ease .05s both;}
  .status-pill{
    display:inline-flex; align-items:center; gap:7px;
    font-family:var(--font-mono); font-size:11.5px;
    padding:5px 11px; border-radius:100px; border:1px solid var(--line);
    color:var(--text-dim); margin-top:16px; width:fit-content;
    animation:fadeUp .5s ease .1s both;
  }
  .status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);}
  .status-pill.live{color:#8be8b0; border-color:#2f5240;}
  .status-pill.live .dot{background:#3fd982; animation:dotPulse 1.8s ease-in-out infinite;}
  .status-pill.closed{color:#e6a15a; border-color:#4a3520;}
  .status-pill.closed .dot{background:#e6a15a;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-top:18px;
    animation:fadeUp .5s ease both;
    box-shadow:0 8px 24px -16px rgba(0,0,0,.5);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity:.6;
  }
  h2{font-family:var(--font-display); font-size:18px; margin:0 0 4px; font-weight:700;}
  p.hint{color:var(--text-dim); font-size:13.5px; line-height:1.5; margin:0 0 16px;}
  label{font-size:12.5px; color:var(--text-dim); display:block; margin-bottom:6px;}
  input[type=text], input[type=password]{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    color:var(--text); padding:12px 13px; border-radius:10px; font-size:15px;
    font-family:var(--font-body); transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(73,211,196,.15);}
  button{
    font-family:var(--font-body); font-weight:600; font-size:14.5px;
    border-radius:10px; border:none; padding:13px 18px; cursor:pointer;
    transition:transform .08s ease, opacity .15s ease, box-shadow .2s ease, filter .15s ease;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary{background:var(--accent); color:#08211d; width:100%; margin-top:14px; box-shadow:0 6px 20px -6px rgba(73,211,196,.55);}
  .btn-primary:not(:disabled):hover{filter:brightness(1.08); box-shadow:0 8px 26px -6px rgba(73,211,196,.7);}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--line); width:100%; margin-top:10px;}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid #4a2320;}
  .btn-danger:hover{background:rgba(228,72,60,.08);}
  .btn-small{padding:8px 12px; font-size:13px;}

  .rules{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px;}
  .rules li{display:flex; gap:10px; font-size:13.5px; color:var(--text-dim); line-height:1.4;}
  .rules li .n{font-family:var(--font-mono); color:var(--accent); flex-shrink:0;}

  footer{margin-top:auto; padding-top:26px; display:flex; justify-content:space-between; align-items:center;}
  .link-btn{background:none; border:none; color:var(--text-dim); font-size:12.5px; padding:4px; text-decoration:underline; text-underline-offset:3px;}

  /* Leaderboard */
  .podium{display:flex; align-items:flex-end; justify-content:center; gap:8px; padding:6px 0 18px; margin-bottom:4px;}
  .podium-item{display:flex; flex-direction:column; align-items:center; width:31%; animation:popIn .45s ease both;}
  .podium-item.place-2{order:1; animation-delay:.05s;}
  .podium-item.place-1{order:2; animation-delay:0s;}
  .podium-item.place-3{order:3; animation-delay:.1s;}
  .podium-medal{font-size:26px; animation:medalBob 2.4s ease-in-out infinite;}
  .podium-item.place-1 .podium-medal{font-size:32px;}
  .podium-name{font-size:12.5px; font-weight:600; margin-top:4px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .podium-score{font-family:var(--font-mono); font-size:14px; font-weight:700; color:var(--accent); margin-top:1px;}
  .podium-stand{
    width:100%; margin-top:8px; border-radius:8px 8px 0 0; display:flex; align-items:flex-start; justify-content:center;
    padding-top:6px; font-family:var(--font-mono); font-size:12px; font-weight:700; color:#0b0e12;
  }
  .place-1 .podium-stand{height:64px; background:linear-gradient(180deg,#ffdd77,#e6b93f);}
  .place-2 .podium-stand{height:46px; background:linear-gradient(180deg,#e7eaf0,#b9bfca);}
  .place-3 .podium-stand{height:34px; background:linear-gradient(180deg,#e3a466,#c07b3c);}
  .lb-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{font-family:var(--font-mono); font-size:14px; color:var(--text-dim); width:22px;}
  .lb-name{flex:1; font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lb-meta{font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}
  .lb-score{font-family:var(--font-mono); font-weight:600; font-size:16px; color:var(--accent);}
  .empty{color:var(--text-dim); font-size:13.5px; text-align:center; padding:20px 0;}

  /* Game screen */
  .game-wrap{display:flex; flex-direction:column; align-items:center; flex:1; text-align:center;}
  .timer-ring{position:relative; width:88px; height:88px; margin:6px 0 22px;}
  .timer-ring svg{transform:rotate(-90deg); width:100%; height:100%;}
  .timer-ring circle{fill:none; stroke-width:6;}
  .timer-ring .bg{stroke:var(--surface-2);}
  .timer-ring .fg{stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s ease;}
  .timer-ring.warn .fg{stroke:#f0b90b;}
  .timer-ring.critical .fg{stroke:var(--danger); animation:ringWarn 1s ease-in-out infinite;}
  .timer-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:15px; font-weight:600;}
  .stimulus-box{
    width:100%; min-height:150px; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:2px solid var(--line); border-radius:var(--radius); margin-bottom:22px;
    transition:border-color .25s ease, box-shadow .25s ease;
  }
  .stimulus{font-family:var(--font-display); font-weight:700; font-size:52px; letter-spacing:0.01em; animation:countPop .28s ease both;}
  .answers{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%;}
  .swatch{
    padding:20px 8px; border-radius:12px; border:2px solid transparent; color:#0b0e12;
    font-family:var(--font-display); font-weight:700; font-size:15px; cursor:pointer;
    transition:transform .06s ease, filter .1s ease, box-shadow .15s ease;
    box-shadow:0 6px 16px -8px rgba(0,0,0,.6);
  }
  .swatch:hover{filter:brightness(1.06); transform:translateY(-1px);}
  .swatch:active{transform:scale(0.96);}
  .swatch.correct-flash{border-color:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.3);}
  .swatch.wrong-flash{opacity:.5;}
  .progress-line{display:flex; gap:14px; font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin-top:18px;}

  .countdown-overlay{
    position:fixed; inset:0;
    background:radial-gradient(circle at 50% 50%, #1c2733 0%, rgba(10,12,15,.96) 65%);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:110px; font-weight:700; color:var(--accent); z-index:50;
    text-shadow:0 0 40px rgba(73,211,196,.55);
  }
  .countdown-overlay span{animation:countPop .55s cubic-bezier(.2,1.4,.4,1) both;}

  .score-hero{text-align:center; margin:14px 0 4px; position:relative;}
  .score-num{font-family:var(--font-mono); font-size:64px; font-weight:600; color:var(--accent); line-height:1; animation:countPop .5s cubic-bezier(.2,1.4,.4,1) both;}
  .score-label{color:var(--text-dim); font-size:12.5px; margin-top:6px;}
  .confetti-wrap{position:absolute; inset:-10px 0 auto 0; height:0; overflow:visible; pointer-events:none;}
  .confetti-wrap span{position:absolute; top:0; font-size:16px; animation:confettiDrop 1.6s ease-in forwards;}
  .rank-banner{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 14px; border-radius:100px; font-family:var(--font-display); font-weight:700; font-size:14px;
    margin:2px auto 0; width:fit-content; animation:popIn .4s ease both;
  }
  .rank-banner.gold{background:linear-gradient(90deg,#3a2f10,#2a2412); color:#ffdd77; border:1px solid #6b551f;}
  .rank-banner.silver{background:linear-gradient(90deg,#2a2d33,#23262c); color:#e7eaf0; border:1px solid #454a54;}
  .rank-banner.bronze{background:linear-gradient(90deg,#332312,#2a1d10); color:#e3a466; border:1px solid #5a3d1f;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:20px;}
  .stat-grid-4{grid-template-columns:1fr 1fr 1fr 1fr; gap:8px;}
  .stat-grid-4 .stat{padding:10px 4px;}
  .stat-grid-4 .v{font-size:14px;}
  .stat{background:var(--surface-2); border-radius:10px; padding:12px 8px; text-align:center;}
  .stat .v{font-family:var(--font-mono); font-size:17px; font-weight:600;}
  .stat .l{font-size:10.5px; color:var(--text-dim); margin-top:3px;}

  .qr-box{background:#fff; border-radius:12px; padding:14px; display:flex; align-items:center; justify-content:center; margin-top:12px;}
  .qr-box img{width:100%; max-width:220px; display:block;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line);}
  .toggle-row:last-child{border-bottom:none;}
  .switch{position:relative; width:44px; height:25px; background:var(--surface-2); border-radius:100px; border:1px solid var(--line); cursor:pointer; flex-shrink:0;}
  .switch .knob{position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:var(--text-dim); transition:all .18s ease;}
  .switch.on{background:var(--accent-dim); border-color:var(--accent);}
  .switch.on .knob{left:21px; background:var(--accent);}
  .back-row{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .back-row button{background:none; border:none; color:var(--text-dim); padding:4px; font-size:13px; cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORE_STATE = 'braingym:gamestate';
const STORE_LB = 'braingym:leaderboard';
const ADMIN_CODE = 'gymhost';
const GAME_SECONDS = 2 * 60;
const TRIAL_TIMEOUT_MS = 4000;
const MAX_QUESTIONS = 40;
const COLORS = [
  {name:'RED', hex:'var(--c-red)', raw:'#e5493d'},
  {name:'BLUE', hex:'var(--c-blue)', raw:'#3e7cf2'},
  {name:'GREEN', hex:'var(--c-green)', raw:'#33b47a'},
  {name:'YELLOW', hex:'var(--c-yellow)', raw:'#f0b90b'},
  {name:'PURPLE', hex:'var(--c-purple)', raw:'#9a6bf0'}
];

let view = 'home';
let playerName = '';
let session = { trials: [], startTime: 0, timeLeft: GAME_SECONDS, current: null, trialTimer: null, tickTimer: null, ended:false };
let lastResult = null;
// Served over http(s) => talk to the BrainGym host server, so every device on
// the WiFi shares one leaderboard. Opened as a plain file => this browser only.
let apiUp = (location.protocol === 'http:' || location.protocol === 'https:');
const API_PATH = { [STORE_STATE]: '/api/state', [STORE_LB]: '/api/leaderboard' };
let hasStorage = !!(window.storage && window.storage.get);
const hasLocal = (()=>{ try{ const k='braingym:__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
let memFallback = { [STORE_STATE]: null, [STORE_LB]: [] };

async function api(path, body){
  const opt = body === undefined
    ? { cache:'no-store' }
    : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  if(!r.ok) throw new Error('api ' + r.status);
  return r.json();
}
function goOffline(){
  apiUp = false;
  if(document.getElementById('offline-note')) return;
  const n = document.createElement('div');
  n.id = 'offline-note';
  n.textContent = 'Server se connection toot gaya - scores sirf is device pe save honge.';
  n.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:#4a2320;color:#ffb4ad;font-size:12.5px;text-align:center;padding:9px 12px;font-family:var(--font-body);';
  document.body.appendChild(n);
}

async function storeGet(key, shared){
  if(apiUp && API_PATH[key]){
    try{ return await api(API_PATH[key]); }catch(e){ goOffline(); }
  }
  if(hasStorage){
    try{
      const r = await window.storage.get(key, shared);
      if(r) return JSON.parse(r.value);
    }catch(e){}
  }
  if(hasLocal){
    try{
      const v = localStorage.getItem(key);
      if(v != null) return JSON.parse(v);
    }catch(e){}
  }
  return memFallback[key] ?? null;
}
async function storeSet(key, value, shared){
  memFallback[key] = value;
  if(apiUp){
    try{
      if(key === STORE_STATE){ await api('/api/state', { live: !!(value && value.live) }); return; }
      if(key === STORE_LB && Array.isArray(value) && value.length === 0){ await api('/api/reset', {}); return; }
    }catch(e){ goOffline(); }
  }
  if(hasLocal){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }
  if(hasStorage){
    try{ await window.storage.set(key, JSON.stringify(value), shared); }catch(e){}
  }
}

async function getGameState(){
  const s = await storeGet(STORE_STATE, true);
  return s || { live:false };
}
async function getLeaderboard(){
  const lb = await storeGet(STORE_LB, true);
  return Array.isArray(lb) ? lb : [];
}

let pollTimer = null;
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
function render(){
  stopPoll();
  const app = document.getElementById('app');
  app.innerHTML='';
  app.appendChild(screens[view]());
  app.querySelectorAll('.card').forEach((c,i)=>{ c.style.animationDelay = (0.08 + i*0.06).toFixed(2)+'s'; });
}
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

/* ---------- HOME ---------- */
function homeScreen(){
  const wrap = el(`
    <div>
      <div class="wordmark">Brain<span>Gym</span><span class="dot">.</span></div>
      <div class="tagline">A fast 2-minute Stroop reaction challenge.</div>
      <div id="status-pill"></div>
      <div class="card">
        <h2>How it works</h2>
        <ul class="rules">
          <li><span class="n">01</span> You'll see a color word printed in an ink color that may not match the word.</li>
          <li><span class="n">02</span> Tap the swatch matching the <strong style="color:var(--text)">ink color</strong>, not the word.</li>
          <li><span class="n">03</span> Up to 40 questions, 4 seconds each, 2 minutes max. Score blends accuracy, response speed, and how fast you finish.</li>
        </ul>
      </div>
      <div class="card">
        <h2>Enroll</h2>
        <p class="hint" id="enroll-hint">Checking session status…</p>
        <label>Your name</label>
        <input type="text" id="name-input" placeholder="e.g. Priya" maxlength="24" />
        <button class="btn-primary" id="join-btn" disabled>Join &amp; play</button>
      </div>
      <div class="card">
        <h2>Leaderboard</h2>
        <div id="lb-mount"><p class="empty">Loading…</p></div>
      </div>
      <footer>
        <span style="font-size:11.5px; color:var(--text-dim)">Reaction time psychology demo</span>
        <button class="link-btn" id="host-link">Host controls</button>
      </footer>
    </div>
  `);
  wrap.querySelector('#host-link').onclick = ()=>{ view='admin-login'; render(); };
  wrap.querySelector('#join-btn').onclick = ()=>{
    const val = wrap.querySelector('#name-input').value.trim();
    if(!val) return;
    playerName = val;
    startCountdown();
  };
  const refresh = async ()=>{
    const state = await getGameState();
    const pillMount = wrap.querySelector('#status-pill');
    const hint = wrap.querySelector('#enroll-hint');
    const joinBtn = wrap.querySelector('#join-btn');
    pillMount.innerHTML = '';
    if(state.live){
      pillMount.appendChild(el(`<div class="status-pill live"><span class="dot"></span>Game is live — enrolling now</div>`));
      hint.textContent = 'Enter your name and start whenever you\'re ready.';
      joinBtn.disabled = false;
    } else {
      pillMount.appendChild(el(`<div class="status-pill closed"><span class="dot"></span>Not launched yet</div>`));
      hint.textContent = 'The host hasn\'t opened enrollment yet. Check back shortly.';
      joinBtn.disabled = true;
    }
    const lb = await getLeaderboard();
    const mount = wrap.querySelector('#lb-mount');
    if(mount) mount.replaceWith(renderLeaderboardList(lb, 5, 'lb-mount'));
  };
  refresh();
  pollTimer = setInterval(()=>{ if(view === 'home') refresh(); }, 3000);
  return wrap;
}

function rankCompare(a,b){
  return b.score - a.score || (a.completionTime ?? 999) - (b.completionTime ?? 999) || a.avgRt - b.avgRt;
}
// One row per player: a repeat run only replaces their entry if it beats it.
function sortLeaderboard(lb){
  const best = new Map();
  for(const r of lb){
    const key = (r.name || '').trim().toLowerCase();
    const prev = best.get(key);
    if(!prev || rankCompare(r, prev) < 0) best.set(key, r);
  }
  return [...best.values()].sort(rankCompare);
}
function renderLeaderboardList(lb, limit, id){
  const sorted = sortLeaderboard(lb);
  const shown = limit ? sorted.slice(0, limit) : sorted;
  const box = el(`<div id="${id}"></div>`);
  if(shown.length === 0){
    box.appendChild(el(`<p class="empty">No scores yet — be the first to play.</p>`));
    return box;
  }
  const top3 = shown.slice(0, 3);
  const rest = shown.slice(3);
  if(top3.length){
    const medals = ['🥇','🥈','🥉'];
    const podium = el(`<div class="podium"></div>`);
    top3.forEach((r, i)=>{
      podium.appendChild(el(`
        <div class="podium-item place-${i+1}">
          <div class="podium-medal">${medals[i]}</div>
          <div class="podium-name">${escapeHtml(r.name)}</div>
          <div class="podium-score">${r.score}</div>
          <div class="podium-stand">${i+1}</div>
        </div>
      `));
    });
    box.appendChild(podium);
  }
  rest.forEach((r, idx)=>{
    const rank = idx + 4;
    const timeStr = r.completionTime!=null ? fmtTime(r.completionTime) : '—';
    box.appendChild(el(`
      <div class="lb-row">
        <div class="lb-rank">${rank}</div>
        <div style="flex:1; min-width:0;">
          <div class="lb-name">${escapeHtml(r.name)}</div>
          <div class="lb-meta">${Math.round(r.accuracy*100)}% acc · ${(r.avgRt/1000).toFixed(2)}s avg · ${timeStr} total</div>
        </div>
        <div class="lb-score">${r.score}</div>
      </div>
    `));
  });
  return box;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function burstConfetti(mount){
  if(!mount) return;
  const emojis = ['🎉','✨','🎊','⭐'];
  for(let i=0;i<12;i++){
    const span = document.createElement('span');
    span.textContent = emojis[i % emojis.length];
    span.style.left = (Math.random()*90 + 5) + '%';
    span.style.animationDelay = (Math.random()*0.4) + 's';
    span.style.fontSize = (12 + Math.random()*10) + 'px';
    mount.appendChild(span);
  }
}


/* ---------- COUNTDOWN + GAME ---------- */
async function startCountdown(){
  const state = await getGameState();
  if(!state.live){ view='home'; render(); return; }
  view = 'countdown';
  render();
  let n = 3;
  const overlay = document.querySelector('.countdown-overlay');
  const showTick = (label)=>{
    overlay.innerHTML = `<span>${label}</span>`;
  };
  const tick = ()=>{
    if(n < 0){ view='game'; initGame(); render(); return; }
    showTick(n === 0 ? 'GO' : n);
    n--;
    setTimeout(tick, 650);
  };
  tick();
}
function countdownScreen(){
  return el(`<div class="countdown-overlay"><span>3</span></div>`);
}

function initGame(){
  session = { trials: [], timeLeft: GAME_SECONDS, current:null, ended:false, startTime: performance.now() };
  session.tickTimer = setInterval(()=>{
    session.timeLeft -= 1;
    if(session.timeLeft <= 0){ endGame(); return; }
    const el = document.getElementById('timer-num');
    if(el) el.textContent = fmtTime(session.timeLeft);
    const ring = document.querySelector('.timer-ring .fg');
    if(ring) setRing(ring, session.timeLeft/GAME_SECONDS);
    const ringWrap = document.querySelector('.timer-ring');
    if(ringWrap){
      ringWrap.classList.toggle('critical', session.timeLeft <= 10);
      ringWrap.classList.toggle('warn', session.timeLeft > 10 && session.timeLeft <= 30);
    }
  }, 1000);
  nextTrial();
}
function fmtTime(s){ const m=Math.floor(s/60); const ss=s%60; return `${m}:${ss.toString().padStart(2,'0')}`; }
function setRing(circle, frac){
  const r = 40; const c = 2*Math.PI*r;
  circle.style.strokeDasharray = c;
  circle.style.strokeDashoffset = c * (1-frac);
}

function pickTrial(){
  const word = COLORS[Math.floor(Math.random()*COLORS.length)];
  const ink = COLORS[Math.floor(Math.random()*COLORS.length)];
  return { word, ink, start: performance.now() };
}
function nextTrial(){
  if(session.ended) return;
  if(session.trials.length >= MAX_QUESTIONS){ endGame(); return; }
  session.current = pickTrial();
  clearTimeout(session.trialTimer);
  renderGameBody();
  session.trialTimer = setTimeout(()=>{
    recordAnswer(null);
  }, TRIAL_TIMEOUT_MS);
}
function recordAnswer(chosenName){
  if(session.ended || !session.current) return;
  const rt = performance.now() - session.current.start;
  const correct = chosenName === session.current.ink.name;
  session.trials.push({ correct, rt: Math.min(rt, TRIAL_TIMEOUT_MS) });
  clearTimeout(session.trialTimer);
  if(session.trials.length >= MAX_QUESTIONS){ endGame(); return; }
  setTimeout(()=>{ if(!session.ended) nextTrial(); }, 120);
}
function endGame(){
  if(session.ended) return;
  session.ended = true;
  clearInterval(session.tickTimer);
  clearTimeout(session.trialTimer);
  const total = session.trials.length;
  const correct = session.trials.filter(t=>t.correct).length;
  const accuracy = total ? correct/total : 0;
  const correctRts = session.trials.filter(t=>t.correct).map(t=>t.rt);
  const avgRt = correctRts.length ? correctRts.reduce((a,b)=>a+b,0)/correctRts.length : TRIAL_TIMEOUT_MS;
  const completionTimeSec = Math.min(GAME_SECONDS, (performance.now() - session.startTime)/1000);
  // Accuracy carries the most weight, then reaction speed, then how quickly the whole set was finished.
  const accuracyPts = accuracy * 600;
  const speedBonus = Math.max(0, Math.min(1, (TRIAL_TIMEOUT_MS - avgRt)/TRIAL_TIMEOUT_MS)) * 250;
  const completionBonus = Math.max(0, Math.min(1, (GAME_SECONDS - completionTimeSec)/GAME_SECONDS)) * 150;
  const score = Math.max(0, Math.round(accuracyPts + speedBonus + completionBonus));
  lastResult = {
    name: playerName, score, accuracy,
    avgRt: Math.round(avgRt),
    completionTime: Math.round(completionTimeSec),
    correct, total, ts: Date.now()
  };
  submitScore(lastResult);
  view = 'result';
  render();
}
async function submitScore(entry){
  if(apiUp){
    try{ await api('/api/score', entry); return; }catch(e){ goOffline(); }
  }
  const lb = await getLeaderboard();
  lb.push(entry);
  await storeSet(STORE_LB, lb, true);
}


function gameScreen(){
  const wrap = el(`
    <div class="game-wrap">
      <div class="timer-ring">
        <svg viewBox="0 0 96 96">
          <circle class="bg" cx="48" cy="48" r="40"></circle>
          <circle class="fg" cx="48" cy="48" r="40"></circle>
        </svg>
        <div class="timer-num" id="timer-num">${fmtTime(session.timeLeft)}</div>
      </div>
      <div class="stimulus-box"><div class="stimulus" id="stimulus-word"></div></div>
      <div class="answers" id="answers-grid"></div>
      <div class="progress-line" id="progress-line"></div>
    </div>
  `);
  const ring = wrap.querySelector('.timer-ring .fg');
  setTimeout(()=>setRing(ring, session.timeLeft/GAME_SECONDS), 30);
  fillGameBody(wrap);
  return wrap;
}
function renderGameBody(){
  const stimEl = document.getElementById('stimulus-word');
  const gridEl = document.getElementById('answers-grid');
  const progEl = document.getElementById('progress-line');
  if(!stimEl || !gridEl) return;
  fillGameBodyDirect(stimEl, gridEl, progEl);
}
function fillGameBody(wrap){
  fillGameBodyDirect(wrap.querySelector('#stimulus-word'), wrap.querySelector('#answers-grid'), wrap.querySelector('#progress-line'));
}
function fillGameBodyDirect(stimEl, gridEl, progEl){
  const { word, ink } = session.current;
  stimEl.textContent = word.name;
  stimEl.style.color = ink.hex;
  stimEl.style.animation = 'none';
  void stimEl.offsetWidth;
  stimEl.style.animation = '';
  const box = stimEl.closest('.stimulus-box');
  if(box){
    box.style.borderColor = ink.raw + '88';
    box.style.boxShadow = `0 0 24px -8px ${ink.raw}66`;
  }
  const shuffled = [...COLORS].sort(()=>Math.random()-0.5);
  gridEl.innerHTML = '';
  shuffled.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'swatch';
    btn.style.background = c.hex;
    btn.textContent = c.name;
    btn.onclick = ()=>{
      btn.classList.add(c.name===ink.name ? 'correct-flash' : 'wrong-flash');
      gridEl.querySelectorAll('button').forEach(b=>b.disabled=true);
      recordAnswer(c.name);
    };
    gridEl.appendChild(btn);
  });
  if(progEl){
    const correct = session.trials.filter(t=>t.correct).length;
    progEl.innerHTML = `<span>Question ${session.trials.length+1}/${MAX_QUESTIONS}</span><span>${correct} correct</span>`;
  }
}

/* ---------- RESULT ---------- */
function resultScreen(){
  const r = lastResult;
  const wrap = el(`
    <div>
      <div class="wordmark">Brain<span>Gym</span><span class="dot">.</span></div>
      <div class="score-hero">
        <div class="confetti-wrap" id="confetti-mount"></div>
        <div class="score-num">${r.score}</div>
        <div class="score-label">points · out of 1000</div>
        <div id="rank-banner-mount"></div>
      </div>
      <div class="stat-grid stat-grid-4">
        <div class="stat"><div class="v">${Math.round(r.accuracy*100)}%</div><div class="l">Accuracy</div></div>
        <div class="stat"><div class="v">${(r.avgRt/1000).toFixed(2)}s</div><div class="l">Avg. speed</div></div>
        <div class="stat"><div class="v">${fmtTime(r.completionTime)}</div><div class="l">Total time</div></div>
        <div class="stat"><div class="v">${r.correct}/${r.total}</div><div class="l">Correct</div></div>
      </div>
      <div class="card">
        <h2>Leaderboard</h2>
        <div id="lb-mount-2"><p class="empty">Loading…</p></div>
      </div>
      <button class="btn-primary" id="again-btn">Play again</button>
      <button class="btn-ghost" id="home-btn">Back to home</button>
    </div>
  `);
  wrap.querySelector('#again-btn').onclick = ()=>{ startCountdown(); };
  wrap.querySelector('#home-btn').onclick = ()=>{ view='home'; render(); };
  (async ()=>{
    const lb = await getLeaderboard();
    const sorted = sortLeaderboard(lb);
    const place = sorted.findIndex(x => x === r || (x.name===r.name && x.score===r.score && x.ts===r.ts));
    const bannerMount = wrap.querySelector('#rank-banner-mount');
    if(place === 0){
      bannerMount.appendChild(el(`<div class="rank-banner gold">🥇 You're #1 right now!</div>`));
      burstConfetti(wrap.querySelector('#confetti-mount'));
    } else if(place === 1){
      bannerMount.appendChild(el(`<div class="rank-banner silver">🥈 2nd place — so close!</div>`));
      burstConfetti(wrap.querySelector('#confetti-mount'));
    } else if(place === 2){
      bannerMount.appendChild(el(`<div class="rank-banner bronze">🥉 3rd place — nice run!</div>`));
      burstConfetti(wrap.querySelector('#confetti-mount'));
    }
    // Keep the result screen's board live too, so a player who has finished
    // still watches later players land on it.
    const refreshLb = async ()=>{
      const cur = await getLeaderboard();
      const mount = wrap.querySelector('#lb-mount-2');
      if(mount) mount.replaceWith(renderLeaderboardList(cur, 8, 'lb-mount-2'));
    };
    await refreshLb();
    pollTimer = setInterval(()=>{ if(view === 'result') refreshLb(); }, 3000);
  })();
  return wrap;
}

/* ---------- ADMIN ---------- */
function adminLoginScreen(){
  const wrap = el(`
    <div>
      <div class="back-row"><button id="back">&larr; Back</button></div>
      <div class="wordmark">Host<span class="dot">.</span></div>
      <div class="tagline">Enter the host passcode to manage the session.</div>
      <div class="card">
        <label>Passcode</label>
        <input type="password" id="pass-input" placeholder="••••••••" />
        <p id="err" style="color:var(--danger); font-size:12.5px; margin:8px 0 0; display:none;">Incorrect passcode.</p>
        <button class="btn-primary" id="enter-btn">Enter</button>
      </div>
    </div>
  `);
  wrap.querySelector('#back').onclick = ()=>{ view='home'; render(); };
  const submit = ()=>{
    const v = wrap.querySelector('#pass-input').value;
    if(v === ADMIN_CODE){ view='admin'; render(); }
    else { wrap.querySelector('#err').style.display='block'; }
  };
  wrap.querySelector('#enter-btn').onclick = submit;
  wrap.querySelector('#pass-input').onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  return wrap;
}

function adminScreen(){
  const wrap = el(`
    <div>
      <div class="back-row"><button id="back">&larr; Back to home</button></div>
      <div class="wordmark">Host controls<span class="dot">.</span></div>
      <div class="card">
        <div class="toggle-row">
          <div>
            <h2 style="margin-bottom:2px;">Launch game</h2>
            <p class="hint" style="margin:0;">Open enrollment so participants can join &amp; play.</p>
          </div>
          <div class="switch" id="live-switch"><div class="knob"></div></div>
        </div>
      </div>
      <div class="card">
        <h2>QR enrollment</h2>
        <p class="hint">Participants isse scan karke join kar sakte hain. Sabko same WiFi pe hona chahiye.</p>
        <label>Join link</label>
        <input type="text" id="url-input" placeholder="https://your-published-link" />
        <div class="qr-box" id="qr-box" style="display:none;"><img id="qr-img" /></div>
      </div>
      <div class="card">
        <h2>Leaderboard (<span id="lb-count"></span>)</h2>
        <div id="lb-mount-admin"><p class="empty">Loading…</p></div>
        <button class="btn-danger" id="reset-btn" style="width:100%; margin-top:14px;">Erase leaderboard</button>
      </div>
    </div>
  `);
  wrap.querySelector('#back').onclick = ()=>{ view='home'; render(); };

  const urlInput = wrap.querySelector('#url-input');
  let qrTimer = null;
  urlInput.oninput = ()=>{
    clearTimeout(qrTimer);
    qrTimer = setTimeout(()=>{
      const val = urlInput.value.trim();
      const box = wrap.querySelector('#qr-box');
      const img = wrap.querySelector('#qr-img');
      if(val){
        img.src = `https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(val)}`;
        box.style.display='flex';
      } else { box.style.display='none'; }
    }, 400);
  };

  const sw = wrap.querySelector('#live-switch');
  let currentLive = false;
  let liveLoaded = false;
  sw.style.opacity = '.5';
  sw.onclick = async ()=>{
    if(!liveLoaded) return;
    currentLive = !currentLive;
    sw.classList.toggle('on', currentLive);
    await storeSet(STORE_STATE, { live: currentLive }, true);
  };

  wrap.querySelector('#reset-btn').onclick = async ()=>{
    if(confirm('Erase all leaderboard scores? This cannot be undone.')){
      await storeSet(STORE_LB, [], true);
      const lb = await getLeaderboard();
      wrap.querySelector('#lb-count').textContent = lb.length;
      wrap.querySelector('#lb-mount-admin').replaceWith(renderLeaderboardList(lb, null, 'lb-mount-admin'));
    }
  };

  (async ()=>{
    if(apiUp){
      try{
        const info = await api('/api/info');
        if(info && info.url){ urlInput.value = info.url; urlInput.dispatchEvent(new Event('input')); }
      }catch(e){}
    }
    const state = await getGameState();
    currentLive = !!state.live;
    sw.classList.toggle('on', currentLive);
    liveLoaded = true;
    sw.style.opacity = '';
    const lb = await getLeaderboard();
    wrap.querySelector('#lb-count').textContent = sortLeaderboard(lb).length;
    wrap.querySelector('#lb-mount-admin').replaceWith(renderLeaderboardList(lb, null, 'lb-mount-admin'));
  })();

  return wrap;
}

const screens = {
  home: homeScreen,
  countdown: countdownScreen,
  game: gameScreen,
  result: resultScreen,
  'admin-login': adminLoginScreen,
  admin: adminScreen
};

render();
</script>
